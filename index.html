<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>BoşSaha — Halı saha rezervasyon</title>
  <style>
    :root{--navy:#111827;--navy-2:#1e3a8a;--blue:#2563eb;--lime:#a3e635;--paper:#f4f7fb;--ink:#172033;--muted:#697386;--line:#dde5f0;--white:#fff}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,Segoe UI,Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}
    .top{height:76px;background:var(--navy);color:white;position:sticky;top:0;z-index:10}.nav{height:100%;max-width:1180px;width:calc(100% - 32px);margin:auto;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:900}.brand-icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--lime);color:var(--navy);font-size:20px}.brand em{color:var(--lime);font-style:normal}.menu{display:flex;gap:5px}.menu button{border:0;background:transparent;color:#cbd5e1;padding:25px 12px;font-weight:800;border-bottom:3px solid transparent}.menu button.active{color:white;border-bottom-color:var(--lime)}.user-actions{display:flex;align-items:center;gap:8px}.user-actions button{border:1px solid #475569;border-radius:10px;padding:10px 13px;font-weight:800}.login{background:transparent;color:white}.signup{background:var(--lime)!important;color:var(--navy)!important;border:0!important}.avatar{width:38px;height:38px;border-radius:50%;background:var(--lime);color:var(--navy);display:grid;place-items:center;font-weight:900}.welcome{display:flex;align-items:center;gap:8px}
    main{max-width:1180px;width:calc(100% - 32px);margin:26px auto 50px}.hero{position:relative;overflow:hidden;border-radius:24px;padding:36px;background:linear-gradient(125deg,var(--navy),var(--navy-2));color:white}.hero:after{content:"⚽";position:absolute;right:-20px;top:-55px;font-size:220px;opacity:.07;transform:rotate(-15deg)}.hero h1{font-size:clamp(32px,5vw,52px);line-height:1.02;margin:10px 0}.hero p{color:#dbeafe}.hero-label{color:var(--lime);font-weight:900;font-size:12px;letter-spacing:1.5px}.search{position:relative;z-index:1;margin-top:23px;display:grid;grid-template-columns:1fr 210px 130px;gap:9px}.control{height:52px;border:0;border-radius:12px;padding:0 14px;background:white;color:var(--ink);min-width:0}.search button{height:52px;border:0;border-radius:12px;background:var(--lime);color:var(--navy);font-weight:900}
    .heading{display:flex;align-items:flex-end;justify-content:space-between;margin:28px 0 14px}.heading h2{margin:0;font-size:24px}.heading p{margin:5px 0 0;color:var(--muted)}.date-list{display:flex;gap:8px;overflow:auto;margin:14px 0}.date{min-width:88px;border:1px solid var(--line);border-radius:12px;background:white;padding:9px;color:var(--ink)}.date strong,.date small{display:block}.date strong{font-size:13px}.date small{font-size:11px;color:var(--muted);margin-top:4px}.date.active{background:var(--navy);border-color:var(--navy);color:white}.date.active small{color:#cbd5e1}
    .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:17px;box-shadow:0 8px 24px #1e293b08}.card-head{display:flex;gap:14px}.pitch{width:95px;height:88px;border-radius:12px;flex:none;display:grid;place-items:center;background:linear-gradient(90deg,#4e8a5d 0 24%,#3f7d50 24% 48%,#4e8a5d 48% 72%,#3f7d50 72%);color:white;font-size:28px}.venue-info{flex:1}.venue-info h3{margin:2px 0 5px}.location,.rating{font-size:12px;color:var(--muted)}.rating b{color:var(--ink)}.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}.tag{background:#eef2f7;color:#5f6b7c;border-radius:6px;padding:4px 7px;font-size:10px}.slots-head{display:flex;justify-content:space-between;border-top:1px solid #edf1f5;margin-top:13px;padding-top:11px;font-size:12px}.slots{display:flex;flex-wrap:wrap;gap:7px;margin-top:8px}.slot{border:1px solid #cbd5e1;border-radius8px;border-radius:8px;background:#f8fafc;color:#1d4ed8;padding:8px 10px;font-weight:800;font-size:12px}.slot.taken{background:#f1f5f9;border-color:#e2e8f0;color:#94a3b8;text-decoration:line-through}.price{font-weight:900;font-size:13px}.empty{grid-column:1/-1;text-align:center;background:white;border:1px solid var(--line);border-radius:16px;padding:40px;color:var(--muted)}
    .backdrop{position:fixed;inset:0;background:#0f172acc;z-index:20;display:none;align-items:center;justify-content:center;padding:16px}.backdrop.open{display:flex}.modal{width:min(440px,100%);max-height:92vh;overflow:auto;background:white;border-radius:18px;padding:24px}.modal h2{margin:0 0 5px}.modal>p{color:var(--muted);font-size:13px}.modal label{display:block;font-size:12px;font-weight:800;margin:12px 0 5px}.modal input{width:100%;height:44px;border:1px solid var(--line);border-radius9px;border-radius:9px;padding:0 11px}.summary{background:#f1f5f9;border-radius10px;padding:12px;font-size:13px;line-height:1.7}.actions{display:flex;gap8px;gap:8px;margin-top:17px}.actions button{flex:1;border-radius9px;padding11px;border-radius:9px;border:0;font-weight:900}.secondary{background:#e2e8f0}.primary{background:var(--navy);color:white}.password-row{position:relative}.password-row button{position:absolute;right:7px;top:7px;height:30px;border:0;background:transparent;color:var(--blue)}
    .toast{position:fixed;bottom:20px;left:50%;z-index:30;transform:translate(-50%,20px);opacity:0;background:var(--navy);color:white;border-radius:10px;padding:12px 16px;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.footer{text-align:center;color:#94a3b8;font-size:12px;margin-top:25px}.mobile-menu{display:none}
    @media(max-width:720px){.top{height:68px}.nav{width:calc(100% - 24px)}.menu{display:none}.welcome span:not(.avatar){display:none}.hero{padding:24px 18px}.search{grid-template-columns:1fr}.search button{margin-top:2px}main{width:calc(100% - 24px)}.cards{grid-template-columns:1fr}.heading{align-items:flex-start}.mobile-menu{display:flex;height:50px;gap:4px;overflow:auto;background:white;border-bottom:1px solid var(--line);padding:0 8px}.mobile-menu button{border:0;background:white;color:#64748b;padding:0 11px;font-weight:800;border-bottom:3px solid transparent}.mobile-menu button.active{color:var(--navy);border-bottom-color:var(--navy)}}
  </style>
</head>
<body>
  <header class="top"><div class="nav">
    <div class="brand"><span class="brand-icon">⚽</span> Boş<em>Saha</em></div>
    <nav class="menu"><button class="active" data-page="venues">Sahalar</button><button data-page="matches">Maç bul</button><button data-page="bookings">Rezervasyonlarım</button></nav>
    <div class="user-actions" id="user-actions"><button class="login" id="open-login">Giriş yap</button><button class="signup" id="open-signup">Kayıt ol</button></div>
  </div></header>
  <nav class="mobile-menu"><button class="active" data-page="venues">Sahalar</button><button data-page="matches">Maç bul</button><button data-page="bookings">Rezervasyonlarım</button></nav>
  <main id="app"></main>
  <div class="toast" id="toast"></div>

  <div class="backdrop" id="auth-backdrop"><section class="modal"><h2 id="auth-title">Kayıt ol</h2><p id="auth-desc">BoşSaha hesabını oluştur ve sahaları kolayca rezerve et.</p>
    <form id="auth-form">
      <div id="signup-fields"><label for="full-name">Ad soyad</label><input id="full-name" minlength="2" placeholder="Adın Soyadın"><label for="phone">Telefon</label><input id="phone" type="tel" placeholder="05xx xxx xx xx"></div>
      <label for="email">E-posta</label><input id="email" type="email" required placeholder="ornek@mail.com">
      <label for="password">Şifre</label><div class="password-row"><input id="password" type="password" required minlength="6" placeholder="En az 6 karakter"><button type="button" id="toggle-password">Göster</button></div>
      <div class="actions"><button type="button" class="secondary" id="close-auth">Vazgeç</button><button type="submit" class="primary" id="auth-submit">Hesap oluştur</button></div>
    </form>
  </section></div>

  <div class="backdrop" id="booking-backdrop"><section class="modal"><h2>Saat için rezervasyon</h2><p>Rezervasyon bilgilerini kontrol et.</p><div class="summary" id="summary"></div>
    <form id="booking-form"><label for="booking-name">Ad soyad</label><input id="booking-name" required minlength="2" placeholder="Ad soyad"><label for="booking-phone">Telefon</label><input id="booking-phone" required minlength="7" placeholder="05xx xxx xx xx"><div class="actions"><button type="button" class="secondary" id="close-booking">Vazgeç</button><button type="submit" class="primary">Rezervasyonu oluştur</button></div></form>
  </section></div>

<script>
const venues=[
 {id:1,city:"İstanbul",district:"Kadıköy",name:"Yeşil Vadi Halı Saha",area:"Fikirtepe",rating:"4.8",reviews:124,tags:["Kapalı","Duş","Otopark"],price:1800,slots:[["18:00",1],["19:00",0],["20:00",1],["21:00",1]]},
 {id:2,city:"İstanbul",district:"Üsküdar",name:"Şampiyon Spor",area:"Altunizade",rating:"4.7",reviews:89,tags:["Açık saha","Duş","Kafeterya"],price:1600,slots:[["17:00",1],["19:00",1],["20:00",0],["22:00",1]]},
 {id:3,city:"İstanbul",district:"Ataşehir",name:"Arena 7/24",area:"İçerenköy",rating:"4.9",reviews:207,tags:["Kapalı","Otopark","Kafeterya"],price:2200,slots:[["18:00",0],["20:00",1],["21:00",1]]},
 {id:4,city:"İstanbul",district:"Beşiktaş",name:"Boğaz Spor Parkı",area:"Levent",rating:"4.6",reviews:63,tags:["Açık saha","Duş"],price:1500,slots:[["17:00",1],["18:00",0],["21:00",1],["22:00",0]]},
 {id:5,city:"Bursa",district:"Nilüfer",name:"Nilüfer Gol Sahası",area:"Beşevler",rating:"4.8",reviews:151,tags:["Kapalı","Duş","Otopark"],price:1450,slots:[["18:00",1],["19:00",0],["20:00",1],["21:00",1]]},
 {id:6,city:"Bursa",district:"Yıldırım",name:"Yıldırım Futbol Arena",area:"Yeşil",rating:"4.7",reviews:96,tags:["Açık saha","Duş","Kafeterya"],price:1300,slots:[["18:00",0],["19:00",1],["20:00",1],["22:00",1]]},
 {id:7,city:"Balıkesir",district:"Karesi",name:"Karesi Halı Saha",area:"Paşa Alanı",rating:"4.6",reviews:74,tags:["Kapalı","Duş","Otopark"],price:1250,slots:[["18:00",1],["19:00",1],["20:00",0],["21:00",1]]},
 {id:8,city:"Balıkesir",district:"Altıeylül",name:"Altıeylül Spor Parkı",area:"Dinkçiler",rating:"4.5",reviews:58,tags:["Açık saha","Duş"],price:1100,slots:[["17:00",1],["18:00",0],["20:00",1],["22:00",1]]},
 {id:9,city:"İzmir",district:"Konak",name:"Konak Pro Halı Saha",area:"Alsancak",rating:"4.8",reviews:118,tags:["Kapalı","Otopark","Duş"],price:1700,slots:[["18:00",1],["20:00",1],["21:00",0],["22:00",1]]},
 {id:10,city:"Ankara",district:"Çankaya",name:"Ankara Arena",area:"Bahçelievler",rating:"4.9",reviews:203,tags:["Kapalı","Otopark","Kafeterya"],price:1900,slots:[["18:00",0],["19:00",1],["20:00",1],["21:00",1]]}
];
const matches=[{title:"Akşam maçı — 2 oyuncu aranıyor",place:"Kadıköy · Yeşil Vadi",time:"Bugün, 20:00",level:"Orta",spots:2},{title:"Dostluk maçı — kaleci aranıyor",place:"Nilüfer · Beşevler",time:"Yarın, 19:00",level:"Başlangıç",spots:1},{title:"Hafta sonu maç — 3 oyuncu aranıyor",place:"Karesi · Paşa Alanı",time:"Pazar, 18:00",level:"İleri",spots:3}];
let selectedDate=new Date();selectedDate.setHours(12,0,0,0);let chosen=null,toastTimer,authMode="signup",currentUser=null;
const $=s=>document.querySelector(s),safeRead=k=>{try{return JSON.parse(localStorage.getItem(k)||"[]")}catch{return[]}};
const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const dateLabel=d=>d.toLocaleDateString("tr-TR",{day:"numeric",month:"long"});
const bookingKey=()=>"bossaha-bookings-"+dateKey(selectedDate);
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}function notify(text){const t=$("#toast");t.textContent=text;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),2600)}
function dateBar(){let html='<div class="date-list">';for(let i=0;i<7;i++){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+i);html+=`<button class="date ${dateKey(d)==dateKey(selectedDate)?"active":""}" data-date="${dateKey(d)}"><strong>${i==0?"Bugün":i==1?"Yarın":d.toLocaleDateString("tr-TR",{weekday:"short"})}</strong><small>${d.toLocaleDateString("tr-TR",{day:"numeric",month:"short"})}</small></button>`}return html+="</div>"}
function shell(){return `<section class="hero"><div class="hero-label">MAÇIN YERİ HAZIR</div><h1>Sahanı bul.<br>Maçını ayarla.</h1><p>Şehir, ilçe veya saha adına göre hızlıca müsaitlik ara.</p><div class="search"><input class="control" id="query" placeholder="Saha veya ilçe ara" value="${escapeHtml(window.lastQuery||"")}"><select class="control" id="city"><option value="">Tüm şehirler</option>${["İstanbul","Bursa","Balıkesir","İzmir","Ankara"].map(c=>`<option ${window.lastCity===c?"selected":""}>${c}</option>`).join("")}</select><button id="find">Saha bul →</button></div></section><div class="heading"><div><h2>Müsait sahalar</h2><p>Günün müsait saatlerini görüntüle</p></div></div>${dateBar()}<div class="cards" id="cards"></div><div class="footer">BoşSaha · Halı saha rezervasyon demo</div>`}
function renderVenueCards(){const q=(window.lastQuery||"").trim().toLocaleLowerCase("tr"),city=window.lastCity||"";const list=venues.filter(v=>(!city||v.city===city)&&(!q||`${v.name} ${v.city} ${v.district} ${v.area}`.toLocaleLowerCase("tr").includes(q)));const bookings=safeRead(bookingKey());$("#cards").innerHTML=list.length?list.map(v=>`<article class="card"><div class="card-head"><div class="pitch">⚽</div><div class="venue-info"><h3>${escapeHtml(v.name)}</h3><div class="location">⌖ ${v.city} · ${v.district}, ${v.area}</div><div class="rating"><span style="color:#e9a23b">★</span> <b>${v.rating}</b> · ${v.reviews} değerlendirme</div><div class="tags">${v.tags.map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join("")}</div></div></div><div class="slots-head"><strong>Saatler</strong><span>${dateLabel(selectedDate)}</span></div><div class="slots">${v.slots.map(([time,free])=>{const taken=!free||bookings.some(b=>b.venueId===v.id&&b.time===time);return `<button class="slot ${taken?"taken":""}" ${taken?"disabled":""} data-venue="${v.id}" data-time="${time}">${taken?"Dolu · "+time:time}</button>`}).join("")}<span class="price">₺${v.price.toLocaleString("tr-TR")} / saat</span></div></article>`).join(""):'<div class="empty"><b>Bu aramayla saha bulunamadı</b><br>Farklı bir şehir veya ilçe dene.</div>';$("#cards").querySelectorAll("[data-venue]").forEach(b=>b.onclick=()=>{const v=venues.find(x=>x.id===Number(b.dataset.venue));chosen={venueId:v.id,venueName:v.name,time:b.dataset.time,price:v.price,date:dateKey(selectedDate)};$("#summary").innerHTML=`<b>${escapeHtml(v.name)}</b><br>${escapeHtml(v.city)} · ${escapeHtml(v.district)}<br>📅 ${dateLabel(selectedDate)} · ${chosen.time}<br>💳 ₺${v.price.toLocaleString("tr-TR")} / saat`;$("#booking-backdrop").classList.add("open")})}
function showVenues(){window.currentPage="venues";$("#app").innerHTML=shell();renderVenueCards();$("#find").onclick=()=>{window.lastQuery=$("#query").value;window.lastCity=$("#city").value;renderVenueCards()};$("#query").oninput=e=>{window.lastQuery=e.target.value;renderVenueCards()};$("#city").onchange=e=>{window.lastCity=e.target.value;renderVenueCards()};document.querySelectorAll(".date").forEach(b=>b.onclick=()=>{selectedDate=new Date(...b.dataset.date.split("-").map(Number));selectedDate=new Date(Number(b.dataset.date.split("-")[0]),Number(b.dataset.date.split("-")[1])-1,Number(b.dataset.date.split("-")[2]),12);showVenues()})}
function showBookings(){window.currentPage="bookings";const all=safeRead(bookingKey());$("#app").innerHTML=`<div class="heading"><div><h2>Rezervasyonlarım</h2><p>Bugüne ait rezervasyonlarını buradan yönet</p></div></div><div class="card">${all.length?all.map((b,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #edf1f5;padding:12px 0"><div><b>${escapeHtml(b.venueName)}</b><br><small>${b.time} · ₺${Number(b.price).toLocaleString("tr-TR")}</small></div><button class="slot" data-cancel="${i}">İptal et</button></div>`).join(""):'<div class="empty">Henüz rezervasyon yok.</div>'}</div>`;$("#app").querySelectorAll("[data-cancel]").forEach(b=>b.onclick=()=>{const items=safeRead(bookingKey());items.splice(Number(b.dataset.cancel),1);localStorage.setItem(bookingKey(),JSON.stringify(items));showBookings();notify("Rezervasyon iptal edildi")})}
function showMatches(){window.currentPage="matches";$("#app").innerHTML=`<div class="heading"><div><h2>Maç bul</h2><p>Oyuncu arayan maçlara katıl</p></div></div><div class="cards">${matches.map((m,i)=>`<article class="card"><div class="card-head" style="display:flex;justify-content:space-between"><div><h3>${escapeHtml(m.title)}</h3><div class="location">⌖ ${escapeHtml(m.place)} · ${escapeHtml(m.time)} · ${escapeHtml(m.level)} · ${m.spots} boş yer</div></div><button class="slot" data-match="${i}">Katıl</button></div></article>`).join("")}</div>`;$("#app").querySelectorAll("[data-match]").forEach(b=>b.onclick=()=>{b.disabled=true;b.textContent="Katıldın ✓";notify("Maça katılma isteğin gönderildi")})}
function navigate(page){document.querySelectorAll("[data-page]").forAll?.;document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));if(page==="venues")showVenues();if(page==="bookings")showBookings();if(page==="matches")showMatches()}document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>navigate(b.dataset.page));
function openAuth(mode){authMode=mode;$("#auth-title").textContent=mode==="signup"?"Kayıt ol":"Giriş yap";$("#auth-desc").textContent=mode==="signup"?"BoşSaha hesabını oluştur ve sahaları kolayca rezerve et.":"Hesabına giriş yap.";$("#signup-fields").style.display=mode==="signup"?"block":"none";$("#auth-submit").textContent=mode==="signup"?"Hesap oluştur":"Giriş yap";$("#auth-backdrop").classList.add("open")}$("#open-signup").onclick=()=>openAuth("signup");$("#open-login").onclick=()=>openAuth("login");$("#close-auth").onclick=()=>$("#auth-backdrop").classList.remove("open");$("#toggle-password").onclick=()=>{const p=$("#password");p.type=p.type==="password"?"text":"password"};
$("#auth-form").onsubmit=e=>{e.preventDefault();const email=$("#email").value.trim(),password=$("#password").value,name=$("#full-name").value.trim();if(authMode==="signup"&&(!name||password.length<6)){notify("Ad soyad ve en az 6 karakterlik şifre gir");return}const safeName=name||email.split("@")[0];currentUser={name:safeName,email};localStorage.setItem("bossaha-user",JSON.stringify(currentUser));$("#user-actions").innerHTML=`<div class="welcome"><span class="avatar">${escapeHtml(safeName.charAt(0).toUpper())}</span><span>${escapeHtml(safeName)}</span></div>`;$("#auth-backdrop").classList.remove("open");e.target.reset();notify(authMode==="signup"?"Hesabın oluşturuldu":"Giriş başarılı")};
$("#close-booking").onclick=()=>$("#booking-backdrop").classList.remove("open");$("#booking-form").onsubmit=e=>{e.preventDefault();if(!chosen)return;const items=safeRead(bookingKey());if(items.some(b=>b.venueId===chosen.venueId&&b.time===chosen.time)){notify("Bu saat zaten rezerve edilmiş")}else{items.push({...chosen,name:$("#booking-name").value.trim(),phone:$("#booking-phone").value.trim()});localStorage.setItem(bookingKey(),JSON.stringify(items));notify("Rezervasyon oluşturuldu 🎉")}$("#booking-backdrop").classList.remove("open");e.target.reset();showVenues()};
$("#auth-backdrop").onclick=e=>{if(e.target.id=== "auth-backdrop")e.currentTarget.classList.remove("open")};$("#booking-backdrop").onclick=e=>{if(e.target.id=== "booking-backdrop")e.currentTarget.classList.remove("open")};document.addEventListener("keydown",e=>{if(e.key==="Escape")document.querySelectorAll(".backdrop").forEach(x=>x.classList.remove("open"))});
const saved=safeRead?null:null;const storedUser=(()=>{try{return JSON.parse(localStorage.getItem("bossaha-user")||"null")}catch{return null}})();if(storedUser){currentUser=storedUser;$("#user-actions").innerHTML=`<div class="welcome"><span class="avatar">${escapeHtml(storedUser.name.charAt(0).toUpperCase())}</span><span>${escapeHtml(storedUser.name)}</span></div>`}showVenues();
</script>
</body>
</html>
