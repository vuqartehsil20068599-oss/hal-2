<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102b20">
  <title>BoşSaha — Halı saha müsaitlikleri</title>
  <style>
    :root{--green:#16734d;--green-dark:#102b20;--lime:#c8f36a;--ink:#17231d;--muted:#758179;--line:#e6ebe7;--paper:#f6f8f6;--white:#fff;--red:#c75454;--shadow:0 12px 35px #173a2510}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9edbba;outline-offset:2px}
    .top{height:74px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.nav{height:100%;max-width:1160px;width:calc(100% - 40px);margin:auto;display:flex;align-items:center;justify-content:space-between;gap:22px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:20px;letter-spacing:-.7px;white-space:nowrap}.brand-icon{width:39px;height:39px;display:grid;place-items:center;background:var(--green-dark);border-radius:13px;color:var(--lime);font-size:20px}.brand em{font-style:normal;color:var(--green)}.menu{height:100%;display:flex;gap:8px;align-items:center}.menu button{height:100%;border:0;border-bottom:2px solid transparent;padding:0 14px;background:none;color:#68756d;font-weight:700}.menu button.active{border-color:var(--green);color:var(--green)}.user{display:flex;align-items:center;gap:9px;font-weight:750}.avatar{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#e8f4ec;color:var(--green);font-weight:900}
    main{max-width:1160px;width:calc(100% - 40px);margin:28px auto 60px}.hero{position:relative;overflow:hidden;padding:32px 36px;border-radius:25px;background:linear-gradient(112deg,#102b20 0%,#155c3e 62%,#217d52 100%);color:white;box-shadow:var(--shadow)}.hero:after{content:"⚽";position:absolute;right:5%;top:-39px;font-size:200px;opacity:.075;transform:rotate(-18deg);pointer-events:none}.hero-label{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;font-weight:850;color:var(--lime)}.hero h1{font-size:clamp(30px,4.5vw,47px);letter-spacing:-1.8px;line-height:1.05;margin:10px 0}.hero p{margin:0;color:#d4e4d9;font-size:15px}.search{position:relative;z-index:1;margin-top:24px;display:grid;grid-template-columns:1fr 190px 145px;gap:9px;max-width:790px}.control{height:50px;border:0;border-radius:12px;background:white;color:var(--ink);padding:0 14px;min-width:0}.search button{background:var(--lime);font-weight:900;color:#183522}.search button:hover{background:#d8ff88}.heading{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:29px 0 15px}.heading h2{margin:0;font-size:23px;letter-spacing:-.6px}.heading p{margin:5px 0 0;color:var(--muted);font-size:14px}.date-list{display:flex;gap:9px;overflow:auto;padding:2px 0 8px;scrollbar-width:thin}.date{min-width:88px;border:1px solid var(--line);border-radius:12px;background:white;padding:10px 12px;color:var(--ink);text-align:center}.date strong,.date small{display:block}.date strong{font-size:13px}.date small{margin-top:4px;color:var(--muted);font-size:11px}.date.active{background:var(--green);border-color:var(--green);color:white}.date.active small{color:#d5ecde}.legend{display:flex;align-items:center;gap:14px;color:var(--muted);font-size:12px}.dot{display:inline-block;width:8px;height:8px;background:#43a66d;border-radius:50%;margin-right:5px}.dot.gray{background:#b6beb9}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.card{background:white;border:1px solid var(--line);border-radius:17px;padding:17px;box-shadow:0 3px 14px #183a2505;transition:.18s}.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}.card-head{display:flex;align-items:flex-start;gap:14px}.pitch{width:96px;height:88px;flex:none;border-radius:12px;display:grid;place-items:center;position:relative;overflow:hidden;background:repeating-linear-gradient(90deg,#478d5b 0 24px,#3e8052 24px 48px)}.pitch:before{content:"";position:absolute;inset:10px 0;border:1px solid #ffffffa8}.pitch:after{content:"";position:absolute;width:37px;height:37px;border:1px solid #ffffffa8;border-radius:50%}.pitch span{z-index:1;font-size:24px;filter:drop-shadow(0 1px 2px #174b2b)}.venue-info{min-width:0;flex:1}.title-line{display:flex;justify-content:space-between;gap:5px}.venue-info h3{margin:1px 0 5px;font-size:16px;letter-spacing:-.3px}.location{font-size:12px;color:var(--muted)}.rating{font-size:12px;color:#66736b;margin-top:7px}.star{color:#e8a743}.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.tag{border-radius:6px;padding:4px 7px;background:#f1f5f2;color:#69756e;font-size:10px}.slots-head{display:flex;justify-content:space-between;gap:10px;margin:15px 0 9px;padding-top:12px;border-top:1px solid #edf0ed}.slots-head strong{font-size:12px}.slots-head span{font-size:11px;color:var(--muted)}.slots{display:flex;align-items:center;flex-wrap:wrap;gap:7px}.slot{border:1px solid #c5e3d0;background:#f0faf3;color:#176942;border-radius:8px;padding:7px 9px;font-size:12px;font-weight:800}.slot:hover{background:#dff3e6}.slot.taken{background:#f1f2f1;border-color:#e5e8e5;color:#9aa39d;text-decoration:line-through;cursor:not-allowed}.price{margin-left:auto;font-size:12px;font-weight:850;white-space:nowrap}.empty{grid-column:1/-1;background:white;text-align:center;padding:42px;border:1px solid var(--line);border-radius:16px;color:var(--muted)}.empty b{display:block;color:var(--ink);margin-bottom:6px;font-size:17px}.page-panel{background:white;border:1px solid var(--line);border-radius:18px;padding:22px}.booking-row{display:flex;align-items:center;justify-content:space-between;gap:14px;border:1px solid var(--line);border-radius:12px;padding:15px;margin-top:10px}.booking-row p{margin:5px 0 0;color:var(--muted);font-size:13px}.cancel{border:1px solid #f0dada;background:#fff7f7;color:var(--red);border-radius:8px;padding:8px 11px;font-weight:750}.match-button{border:0;background:var(--green);color:white;border-radius:9px;padding:10px 14px;font-weight:800}.footer{text-align:center;color:#8b968f;font-size:12px;margin-top:25px}.toast{position:fixed;bottom:22px;left:50%;z-index:20;transform:translate(-50%,18px);opacity:0;pointer-events:none;background:#173c2a;color:white;border-radius:11px;padding:12px 17px;box-shadow:var(--shadow);transition:.2s;font-size:14px;max-width:calc(100% - 30px);text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}.backdrop{position:fixed;inset:0;background:#0d2118aa;z-index:15;display:none;align-items:center;justify-content:center;padding:16px}.backdrop.open{display:flex}.modal{width:min(430px,100%);background:white;border-radius:19px;padding:23px;box-shadow:0 25px 80px #0003}.modal h2{margin:0 0 5px;letter-spacing:-.5px}.modal>p{font-size:13px;color:var(--muted);margin:0 0 15px}.summary{padding:12px;border-radius:10px;background:#f1f7f3;font-size:13px;line-height:1.7;margin-bottom:15px}.modal label{display:block;font-size:12px;font-weight:800;margin:11px 0 5px}.modal input{width:100%;border:1px solid var(--line);border-radius:9px;padding:11px}.actions{display:flex;gap:9px;margin-top:18px}.actions button{flex:1;border-radius:9px;padding:11px;font-weight:800}.secondary{border:1px solid var(--line);background:white}.primary{border:0;background:var(--green);color:white}
    @media(max-width:720px){.nav{width:calc(100% - 24px)}.menu{display:none}.mobile-menu{display:flex;gap:6px;overflow:auto;background:white;border-bottom:1px solid var(--line);padding:0 12px}.mobile-menu button{white-space:nowrap;border:0;background:white;color:#68756d;padding:12px 10px;font-weight:750}.mobile-menu button.active{color:var(--green);box-shadow:inset 0 -2px var(--green)}main{width:calc(100% - 24px);margin-top:17px}.hero{padding:25px 19px;border-radius:19px}.hero:after{right:-35px;font-size:145px}.search{grid-template-columns:1fr 1fr}.search input{grid-column:1/-1}.search button{height:48px}.cards{grid-template-columns:1fr}.heading h2{font-size:21px}.legend{font-size:11px}.user span{display:none}}
    @media(min-width:721px){.mobile-menu{display:none}}
  </style>
</head>
<body>
  <header class="top">
    <div class="nav">
      <div class="brand"><span class="brand-icon">⚽</span> Boş<em>Saha</em></div>
      <nav class="menu" aria-label="Ana menü">
        <button class="active" data-page="venues">Sahalar</button><button data-page="matches">Maç bul</button><button data-page="bookings">Rezervasyonlarım</button>
      </nav>
      <div class="user"><span class="avatar">V</span><span>Vuqar</span></div>
    </div>
    <nav class="mobile-menu" aria-label="Mobil menü">
      <button class="active" data-page="venues">Sahalar</button><button data-page="matches">Maç bul</button><button data-page="bookings">Rezervasyonlarım</button>
    </nav>
  </header>
  <main id="app"></main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="backdrop" id="backdrop">
    <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <h2 id="modal-title">Saat için rezervasyon</h2><p>Demo rezervasyonunu oluşturmak için bilgilerini yaz.</p>
      <div class="summary" id="summary"></div>
      <form id="booking-form"><label for="name">Adın</label><input id="name" name="name" required minlength="2" placeholder="Ad soyad"><label for="phone">Telefon numaran</label><input id="phone" name="phone" required type="tel" minlength="7" placeholder="05xx xxx xx xx"><div class="actions"><button class="secondary" type="button" id="close-modal">Vazgeç</button><button class="primary" type="submit">Onayla</button></div></form>
    </section>
  </div>
  <script>
    const venues=[
      {id:1,name:"Yeşil Vadi Halı Saha",district:"Kadıköy",area:"Fikirtepe",rating:"4.8",reviews:124,tags:["Kapalı saha","Duş","Otopark"],price:1800,slots:[["18:00",1],["19:00",0],["20:00",1],["21:00",1]]},
      {id:2,name:"Şampiyon Spor Tesisleri",district:"Üsküdar",area:"Altunizade",rating:"4.7",reviews:89,tags:["Açık saha","Duş","Kafeterya"],price:1600,slots:[["17:00",1],["19:00",1],["20:00",0],["22:00",1]]},
      {id:3,name:"Arena 7/24",district:"Ataşehir",area:"İçerenköy",rating:"4.9",reviews:207,tags:["Kapalı saha","Otopark","Kafeterya"],price:2200,slots:[["18:00",0],["20:00",1],["21:00",1]]},
      {id:4,name:"Boğaz Spor Parkı",district:"Beşiktaş",area:"Levent",rating:"4.6",reviews:63,tags:["Açık saha","Duş"],price:1500,slots:[["17:00",1],["18:00",0],["21:00",1],["22:00",0]]},
      {id:5,name:"Golazo Halı Saha",district:"Kadıköy",area:"Kozyatağı",rating:"4.8",reviews:152,tags:["Kapalı saha","Duş","Otopark"],price:1900,slots:[["18:00",1],["19:00",0],["20:00",1],["21:00",1]]},
      {id:6,name:"Mavi Çim Spor",district:"Üsküdar",area:"Çengelköy",rating:"4.5",reviews:48,tags:["Açık saha","Kafeterya"],price:1400,slots:[["18:00",0],["19:00",1],["20:00",1],["22:00",1]]}
    ];
    const matches=[{title:"Akşam maçı — 2 oyuncu aranıyor",place:"Kadıköy · Yeşil Vadi",time:"Bugün, 20:00",level:"Orta seviye",spots:2},{title:"Dostluk maçı — kaleci aranıyor",place:"Üsküdar · Şampiyon Spor",time:"Yarın, 19:00",level:"Her seviye",spots:1}];
    let selectedDate=new Date();selectedDate.setHours(12,0,0,0);let chosen=null;let toastTimer;
    const $=s=>document.querySelector(s);const safeRead=k=>{try{return JSON.parse(localStorage.getItem(k)||"[]")}catch{return[]}};
    const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
    const dateLabel=d=>d.toLocaleDateString("tr-TR",{day:"numeric",month:"long"});
    const bookingKey=()=>"bossaha-bookings-"+dateKey(selectedDate);
    function notify(text){const t=$("#toast");t.textContent=text;t.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove("show"),2600)}
    function dateBar(){let html='<div class="date-list">';for(let i=0;i<7;i++){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+i);html+=`<button class="date ${dateKey(d)===dateKey(selectedDate)?"active":""}" data-date="${dateKey(d)}"><strong>${i===0?"Bugün":i===1?"Yarın":d.toLocaleDateString("tr-TR",{weekday:"short"})}</strong><small>${d.toLocaleDateString("tr-TR",{day:"numeric",month:"short"})}</small></button>`}return html+="</div>"}
    function shell(){return `<section class="hero"><div class="hero-label">Maçın yeri hazır</div><h1>Boş sahayı bul.<br>Maçını hemen ayarla.</h1><p>Yakınındaki halı sahaların müsait saatlerini keşfet.</p><div class="search"><input class="control" id="query" type="search" placeholder="Saha veya semt ara" value="${escapeHtml(window.lastQuery||"")}"><select class="control" id="district"><option value="">Tüm ilçeler</option>${["Kadıköy","Üsküdar","Ataşehir","Beşiktaş"].map(d=>`<option ${window.lastDistrict===d?"selected":""}>${d}</option>`).join("")}</select><button class="control" id="find">Saha bul　→</button></div></section><div class="heading"><div><h2>Müsait sahalar</h2><p>Gününü seç, boş ve dolu saatleri birlikte gör.</p></div><div class="legend"><span><i class="dot"></i>Müsait</span><span><i class="dot gray"></i>Dolu</span></div></div>${dateBar()}<div class="heading" style="margin-top:10px"><div><strong id="result-count"></strong></div><span class="location">Fiyatlar saatliktir</span></div><div class="cards" id="cards"></div><div class="footer">BoşSaha demo · Saha ve müsaitlik bilgileri örnek amaçlıdır.</div>`}
    function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
    function renderVenueCards(){const query=(window.lastQuery||"").trim().toLocaleLowerCase("tr");const district=window.lastDistrict||"";const list=venues.filter(v=>(!district||v.district===district)&&(!query||`${v.name} ${v.district} ${v.area}`.toLocaleLowerCase("tr").includes(query)));$("#result-count").textContent=`${list.length} saha bulundu · ${dateLabel(selectedDate)}`;const bookings=safeRead(bookingKey());
      $("#cards").innerHTML=list.length?list.map(v=>{const reserved=bookings.filter(b=>b.venueId===v.id).map(b=>b.time);return `<article class="card"><div class="card-head"><div class="pitch"><span>⚽</span></div><div class="venue-info"><h3>${escapeHtml(v.name)}</h3><div class="location">⌖ ${escapeHtml(v.district)}, ${escapeHtml(v.area)}</div><div class="rating"><span class="star">★</span> <b>${v.rating}</b> · ${v.reviews} değerlendirme</div><div class="tags">${v.tags.map(t=>`<span class="tag">${escapeHtml(t)}</span>`).join("")}</div></div></div><div class="slots-head"><strong>Saatler</strong><span>60 dk · 7'ye 7</span></div><div class="slots">${v.slots.map(([time,free])=>{const taken=!free||reserved.includes(time);return `<button class="slot ${taken?"taken":""}" ${taken?"disabled":""} data-venue="${v.id}" data-time="${time}">${taken?"Dolu · "+time:time}</button>`}).join("")}<span class="price">₺${v.price.toLocaleString("tr-TR")} / saat</span></div></article>`}).join(""):'<div class="empty"><b>Bu aramayla saha bulamadık</b>Başka bir semt veya saha adı deneyebilirsin.</div>';
      $("#cards").querySelectorAll("[data-venue]").forEach(btn=>btn.addEventListener("click",()=>{const v=venues.find(x=>x.id===Number(btn.dataset.venue));chosen={venueId:v.id,venueName:v.name,time:btn.dataset.time,price:v.price,date:dateKey(selectedDate)};$("#summary").innerHTML=`<b>${escapeHtml(v.name)}</b><br>📅 ${dateLabel(selectedDate)} · ${chosen.time}<br>💳 ₺${v.price.toLocaleString("tr-TR")} / saat`;$("#backdrop").classList.add("open");$("#name").focus()}));
    }
    function showVenues(){window.currentPage="venues";$("#app").innerHTML=shell();renderVenueCards();wireDates();$("#find").onclick=()=>{window.lastQuery=$("#query").value;window.lastDistrict=$("#district").value;renderVenueCards()};$("#query").addEventListener("input",()=>{window.lastQuery=$("#query").value;renderVenueCards()});$("#district").onchange=()=>{window.lastDistrict=$("#district").value;renderVenueCards()}}
    function wireDates(){$(".date-list").querySelectorAll(".date").forEach(b=>b.onclick=()=>{const [y,m,d]=b.dataset.date.split("-").map(Number);selectedDate=new Date(y,m-1,d,12);showVenues()})}
    function showBookings(){window.currentPage="bookings";const all=safeRead(bookingKey());$("#app").innerHTML=`<div class="heading"><div><h2>Rezervasyonlarım</h2><p>Bu tarayıcıda yaptığın demo rezervasyonları burada görünür.</p></div></div><section class="page-panel">${all.length?all.map((b,i)=>`<div class="booking-row"><div><strong>${escapeHtml(b.venueName)}</strong><p>${dateLabel(selectedDate)} · ${b.time} · ₺${Number(b.price).toLocaleString("tr-TR")}</p></div><button class="cancel" data-cancel="${i}">İptal et</button></div>`).join(""):'<div class="empty"><b>Henüz rezervasyonun yok</b>Sahalar sekmesinden yeşil bir saat seçerek demo rezervasyonu oluşturabilirsin.</div>'}</section>`;$("#app").querySelectorAll("[data-cancel]").forEach(b=>b.onclick=()=>{const items=safeRead(bookingKey());items.splice(Number(b.dataset.cancel),1);localStorage.setItem(bookingKey(),JSON.stringify(items));showBookings();notify("Rezervasyon iptal edildi")})}
    function showMatches(){window.currentPage="matches";$("#app").innerHTML=`<div class="heading"><div><h2>Maç bul</h2><p>Eksik oyuncusu olan demo maçlarına katıl.</p></div></div><section class="page-panel">${matches.map((m,i)=>`<div class="booking-row"><div><strong>${escapeHtml(m.title)}</strong><p>📍 ${escapeHtml(m.place)} · ${escapeHtml(m.time)} · ${escapeHtml(m.level)} · ${m.spots} boş yer</p></div><button class="match-button" data-join="${i}">Katıl</button></div>`).join("")}</section><div class="footer">Maç ilanları demo amaçlı örnektir.</div>`;$("#app").querySelectorAll("[data-join]").forEach(b=>b.onclick=()=>{b.disabled=true;b.textContent="Katıldın ✓";notify("Demo maçına katılma isteğin gönderildi")})}
    function navigate(page){document.querySelectorAll("[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));if(page==="venues")showVenues();if(page==="bookings")showBookings();if(page==="matches")showMatches()}
    document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>navigate(b.dataset.page));
    $("#close-modal").onclick=()=>$("#backdrop").classList.remove("open");$("#backdrop").onclick=e=>{if(e.target.id==="backdrop")e.currentTarget.classList.remove("open")};document.addEventListener("keydown",e=>{if(e.key==="Escape")$("#backdrop").classList.remove("open")});
    $("#booking-form").onsubmit=e=>{e.preventDefault();if(!chosen)return;const items=safeRead("bossaha-bookings-"+chosen.date);if(items.some(b=>b.venueId===chosen.venueId&&b.time===chosen.time)){notify("Bu saat artık müsait değil")}else{items.push({...chosen,name:$("#name").value.trim(),phone:$("#phone").value.trim()});localStorage.setItem("bossaha-bookings-"+chosen.date,JSON.stringify(items));notify("Demo rezervasyonun oluşturuldu! ⚽")}$("#backdrop").classList.remove("open");e.target.reset();if(window.currentPage==="venues")showVenues()};
    showVenues();
  </script>
</body>
</html>
